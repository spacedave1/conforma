[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "conforma"
version = "0.1.0"
description = "Contract-based evaluation for LLM prompt behavior."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Conforma maintainers" }
]
dependencies = [
  "jsonschema>=4.22",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
chart = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
conforma = "conforma.run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
